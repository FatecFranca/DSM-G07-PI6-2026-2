services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe-pi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe_pi
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
